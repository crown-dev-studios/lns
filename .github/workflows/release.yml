name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag must be semantic, for example v0.1.0" >&2
            exit 1
          fi

  verify:
    uses: ./.github/workflows/verify.yml

  release:
    name: Publish ${{ github.ref_name }}
    needs:
      - validate-tag
      - verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.1
          cache: true

      - name: Verify Homebrew credential
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "Missing required release secret: HOMEBREW_TAP_TOKEN" >&2
            exit 1
          fi

      - name: Check out Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crown-dev-studios/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: build/homebrew-tap
          fetch-depth: 0

      - name: Prepare Homebrew tap branch
        if: ${{ !contains(github.ref_name, '-') }}
        id: homebrew_branch
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          branch="lns/$RELEASE_TAG"
          if git -C build/homebrew-tap ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git -C build/homebrew-tap fetch origin "$branch"
            git -C build/homebrew-tap checkout -B "$branch" FETCH_HEAD
          else
            git -C build/homebrew-tap checkout -b "$branch"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Render Homebrew formula
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          release_commit=$(git rev-parse HEAD)
          source_archive="$RUNNER_TEMP/lns-$version.tar.gz"
          source_url="https://github.com/crown-dev-studios/lns/archive/$release_commit.tar.gz"
          curl --fail --location --retry 3 --output "$source_archive" "$source_url"
          source_checksum=$(sha256sum "$source_archive" | cut -d ' ' -f 1)
          build_date=$(git show -s --format=%cI "$release_commit")
          bash scripts/render-homebrew-formula.sh \
            "$version" \
            "$source_checksum" \
            "$release_commit" \
            "$build_date" \
            build/homebrew-tap/Formula/lns.rb
          ruby -c build/homebrew-tap/Formula/lns.rb
          if grep -q '@@' build/homebrew-tap/Formula/lns.rb; then
            echo "Generated formula contains an unresolved template value" >&2
            exit 1
          fi

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.52.0

      - name: Add Syft to PATH
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: echo "$(dirname "$SYFT_CMD")" >> "$GITHUB_PATH"

      - name: Publish release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release archives
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: build/release/*.tar.gz

      - name: Open Homebrew formula pull request
        if: ${{ !contains(github.ref_name, '-') }}
        id: homebrew_pr
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_BRANCH: ${{ steps.homebrew_branch.outputs.branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git -C build/homebrew-tap config user.name lns-release-bot
          git -C build/homebrew-tap config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C build/homebrew-tap add Formula/lns.rb
          if ! git -C build/homebrew-tap diff --cached --quiet; then
            git -C build/homebrew-tap diff --cached --check
            git -C build/homebrew-tap commit -m "lns $RELEASE_TAG"
            git -C build/homebrew-tap push origin "HEAD:refs/heads/$HOMEBREW_BRANCH"
          fi

          pr_url=$(gh pr list \
            --repo crown-dev-studios/homebrew-tap \
            --head "$HOMEBREW_BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url // empty')
          if [[ -z "$pr_url" ]]; then
            git -C build/homebrew-tap fetch origin main
            if git -C build/homebrew-tap merge-base --is-ancestor HEAD FETCH_HEAD; then
              echo "Homebrew formula already points at $RELEASE_TAG"
            else
              closed_pr=$(gh pr list \
                --repo crown-dev-studios/homebrew-tap \
                --head "$HOMEBREW_BRANCH" \
                --state closed \
                --json number,mergedAt \
                --jq 'map(select(.mergedAt == null))[0].number // empty')
              if [[ -n "$closed_pr" ]]; then
                gh pr reopen "$closed_pr" --repo crown-dev-studios/homebrew-tap
                pr_url=$(gh pr view "$closed_pr" --repo crown-dev-studios/homebrew-tap --json url --jq .url)
              else
                pr_url=$(gh pr create \
                  --repo crown-dev-studios/homebrew-tap \
                  --base main \
                  --head "$HOMEBREW_BRANCH" \
                  --title "lns $RELEASE_TAG" \
                  --body "Build and publish Homebrew bottles for crown-dev-studios/lns $RELEASE_TAG.")
              fi
            fi
          fi
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Summarize release
        env:
          HOMEBREW_PR_URL: ${{ steps.homebrew_pr.outputs.url }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Published $RELEASE_TAG"
            echo
            echo "### Artifacts"
            jq -r '.[] | select(.type == "Archive" or .type == "Checksum" or .type == "SBOM") | "- `\(.name)`"' build/release/artifacts.json
            if [[ -n "${HOMEBREW_PR_URL:-}" ]]; then
              echo
              echo "### Homebrew"
              echo "- Bottle pull request: $HOMEBREW_PR_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
  verify-published:
    name: Verify published checksums
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Verify checksums
        working-directory: release-assets
        run: sha256sum --check checksums.txt
