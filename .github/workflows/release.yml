name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag must be semantic, for example v0.1.0" >&2
            exit 1
          fi

  verify:
    uses: ./.github/workflows/verify.yml

  release:
    name: Publish ${{ github.ref_name }}
    needs:
      - validate-tag
      - verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      release_commit: ${{ steps.homebrew_formula.outputs.release_commit }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.1
          cache: true

      - name: Verify Homebrew credential
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "Missing required release secret: HOMEBREW_TAP_TOKEN" >&2
            exit 1
          fi

      - name: Check out Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crown-dev-studios/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: build/homebrew-tap

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.52.0

      - name: Add Syft to PATH
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: echo "$(dirname "$SYFT_CMD")" >> "$GITHUB_PATH"

      - name: Publish release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release archives
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: build/release/*.tar.gz

      - name: Render Homebrew formula
        if: ${{ !contains(github.ref_name, '-') }}
        id: homebrew_formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          release_commit=$(git rev-parse HEAD)
          bash scripts/render-homebrew-formula.sh \
            "$version" \
            build/release/checksums.txt \
            build/homebrew-tap/Formula/lns.rb
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"
          ruby -c build/homebrew-tap/Formula/lns.rb
          if grep -q '@@' build/homebrew-tap/Formula/lns.rb; then
            echo "Generated formula contains an unresolved template value" >&2
            exit 1
          fi

      - name: Publish Homebrew formula
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git -C build/homebrew-tap config user.name lns-release-bot
          git -C build/homebrew-tap config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C build/homebrew-tap add Formula/lns.rb
          if git -C build/homebrew-tap diff --cached --quiet; then
            echo "Homebrew formula already points at $RELEASE_TAG"
            exit 0
          fi
          git -C build/homebrew-tap diff --cached --check
          git -C build/homebrew-tap commit -m "lns $RELEASE_TAG"
          git -C build/homebrew-tap push origin HEAD:main

      - name: Summarize release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Published $RELEASE_TAG"
            echo
            echo "### Artifacts"
            jq -r '.[] | select(.type == "Archive" or .type == "Checksum" or .type == "SBOM") | "- `\(.name)`"' build/release/artifacts.json
          } >> "$GITHUB_STEP_SUMMARY"

  verify-published:
    name: Verify published checksums
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Verify checksums
        working-directory: release-assets
        run: sha256sum --check checksums.txt

  verify-homebrew:
    name: Verify Homebrew installation
    if: ${{ !contains(github.ref_name, '-') }}
    needs: release
    runs-on: macos-latest
    steps:
      - name: Install from the published formula
        run: |
          test ! -e "$HOME/.lns"
          go_before=$(brew list --versions go || true)
          brew install crown-dev-studios/tap/lns
          go_after=$(brew list --versions go || true)
          if [[ "$go_after" != "$go_before" ]]; then
            echo "Installing LNS unexpectedly changed the installed Go formula" >&2
            exit 1
          fi

      - name: Verify installed behavior
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.release.outputs.release_commit }}
        run: |
          expected_version=${RELEASE_TAG#v}
          version_output=$(lns version)
          echo "$version_output"
          if [[ "$version_output" != "lns version $expected_version (commit ${RELEASE_COMMIT:0:12},"* ]]; then
            echo "Installed LNS does not report $expected_version from $RELEASE_COMMIT" >&2
            exit 1
          fi
          brew list --formula caddy >/dev/null
          brew test crown-dev-studios/tap/lns
          lns doctor
          test ! -e "$HOME/.lns"
